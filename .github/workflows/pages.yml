# Publica la carpeta web/ (dashboard) en GitHub Pages.
# Requisito único: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Publicar dashboard en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch: # permite publicar a mano desde la pestaña Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Una sola publicación a la vez; no se cancela una que ya está en curso
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Comprobar que existen los datos del dashboard
        run: |
          test -f web/index.html
          test -f web/data/indicadores.json
          test -f web/data/peru_departamentos.topo.json

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir la carpeta web/
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
